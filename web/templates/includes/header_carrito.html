<li class="h-cart" id="h-cart">
    <a class="cart-contents" href="{% url 'web:carrito' %}">
        <p class="h-cart-icon">
            <i class="ion-android-cart"></i>
            <span id="cart-count">{{ request.session.cart|length }}</span>
        </p>
        <p class="h-cart-total">s/<span id="cart-total">{{ request.session.cartMontoTotal|default:"0.00" }}</span></p>
    </a>
</li>
