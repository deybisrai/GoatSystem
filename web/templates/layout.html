{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GOAT X</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">

    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,900%7COpen+Sans:300,300i,400,400i,600,600i,700,700i&amp;subset=cyrillic" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/ionicons.min.css' %}">

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/jquery.formstyler.css' %}">
    <link rel="stylesheet" href="{% static 'css/flexslider.css' %}">
    <link rel="stylesheet" href="{% static 'css/jquery.fancybox.css' %}">
    <link rel="stylesheet" href="{% static 'css/ion.rangeSlider.css' %}">
    <link rel="stylesheet" href="{% static 'css/jquery.mThumbnailScroller.css' %}">
    <link rel="stylesheet" href="{% static 'css/chosen.css' %}">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/elements.css' %}">
    <link rel="stylesheet" href="{% static 'css/media.css' %}">
    <link rel="stylesheet" href="{% static 'css/elements-media.css' %}">

    <style>
        /* Avisos flotantes arriba a la derecha */
        #avisos {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 320px;
            max-width: calc(100vw - 40px);
            pointer-events: none;
        }
        .aviso-flotante {
            pointer-events: auto;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 13px 15px;
            border-radius: 4px;
            border-left: 3px solid #3e7a4c;
            background: #fff;
            color: #245132;
            font-size: 14px;
            line-height: 1.4;
            box-shadow: 0 6px 22px rgba(0, 0, 0, .16);
            animation: aviso-entra .28s ease;
        }
        .aviso-flotante.saliendo {
            animation: aviso-sale .3s ease forwards;
        }
        .aviso-flotante.es-error {
            border-left-color: #b5541b;
            color: #7d3a13;
        }
        .aviso-icono {
            flex: 0 0 auto;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.3;
        }
        .aviso-texto { flex: 1 1 auto; }
        .aviso-cerrar {
            flex: 0 0 auto;
            border: 0;
            background: none;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            color: inherit;
            opacity: .5;
            padding: 0 2px;
        }
        .aviso-cerrar:hover { opacity: 1; }

        @keyframes aviso-entra {
            from { opacity: 0; transform: translateX(24px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes aviso-sale {
            from { opacity: 1; transform: translateX(0); }
            to   { opacity: 0; transform: translateX(24px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .aviso-flotante, .aviso-flotante.saliendo { animation: none; }
        }

        /* --- Header en flex: logo a la izquierda, cuenta y carrito al extremo derecho --- */
        .site-header {
            display: flex;
            align-items: center;
            padding: 15px 25px;
        }
        .site-header:after { display: none; }

        .site-header .h-logo {
            flex: 0 0 auto;
            width: auto;
            padding: 0;
            margin-right: 30px;
        }
        .site-header .h-logo img {
            height: 54px;
            width: auto;
            max-height: none;
            max-width: none;
        }
        /* al fijarse el header, el logo se encoge un poco */
        body .header-sticky .site-header.header_sticky .h-logo img {
            height: 42px;
        }
        .site-header .h-shop {
            flex: 1 1 auto;
            min-width: 0;          /* evita que flex desborde por el contenido */
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            width: auto;
            height: auto;
            padding: 0;
            position: relative;
            /* el theme lo desplaza con left/top en algunos anchos */
            left: auto;
            right: auto;
            top: auto;
        }
        .site-header .h-search {
            flex: 1 1 auto;
            max-width: 430px;
            margin-right: auto;
        }
        .site-header .h-shop-links {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            position: relative;
            right: auto;
            left: auto;
            top: auto;
            width: auto;
            height: auto;
            margin: 0;
            padding-left: 16px;
            white-space: nowrap;
        }
        .site-header .h-shop-links .h-shop-icon,
        .site-header .h-shop-links .h-cart {
            margin: 0 0 0 18px;
        }
        .site-header .h-shop-links > :first-child { margin-left: 0; }

        /* Header fijo: conserva el margen lateral y no se tapa con los avisos */
        body .header-sticky .site-header.header_sticky {
            z-index: 500;
            padding: 8px 25px;
            box-shadow: 0 2px 14px rgba(0, 0, 0, .09);
        }

        /* el logo del pie tampoco debe salir a tamano completo */
        .site-footer .f-logo img {
            height: 64px;
            width: auto;
            max-width: 100%;
        }

        @media (max-width: 1024px) {
            .site-header,
            body .header-sticky .site-header.header_sticky {
                padding-left: 14px;
                padding-right: 14px;
            }
            .site-header .h-logo { margin-right: 16px; }
            .site-header .h-logo img { height: 44px; }
        }

        @media (max-width: 600px) {
            .site-header .h-shop { gap: 8px; }
            .site-header .h-shop-links { padding-left: 8px; }
            .site-header .h-shop-links .h-shop-icon,
            .site-header .h-shop-links .h-cart { margin-left: 10px; }
            /* en pantallas chicas basta el icono con su contador */
            .site-header .h-cart .h-cart-total { display: none; }
        }
    </style>
</head>
<body>
<div id="avisos" aria-live="polite"></div>
{% include "includes/pedido_en_curso.html" %}

<div id="page" class="site header-sticky">

    {% include 'includes/navbar.html' %}

    {% include 'includes/header.html' %}

    <div id="content" class="site-content">
        <div id="primary" class="content-area">
            <main id="main" class="site-main">
                <div class="cont maincont">
                    {% block content %}
                    {% endblock %}
                </div>
            </main><!-- #main -->
        </div><!-- #primary -->

    </div><!-- #content -->

    {% include 'includes/footer.html' %}
</div><!-- #page -->

<script src="{% static 'js/jquery-1.12.4.min.js' %}"></script>
<script src="{% static 'js/jquery-plugins.js' %}"></script>
<script src="{% static 'js/main.js' %}"></script>

<script>
// Avisos flotantes reutilizables en todo el sitio
window.mostrarAviso = function (texto, esError) {
    var contenedor = document.getElementById('avisos');
    if (!contenedor) return;

    var aviso = document.createElement('div');
    aviso.className = 'aviso-flotante' + (esError ? ' es-error' : '');

    var icono = document.createElement('span');
    icono.className = 'aviso-icono';
    icono.textContent = esError ? '!' : '✓';

    var cuerpo = document.createElement('span');
    cuerpo.className = 'aviso-texto';
    cuerpo.textContent = texto;

    var cerrar = document.createElement('button');
    cerrar.type = 'button';
    cerrar.className = 'aviso-cerrar';
    cerrar.setAttribute('aria-label', 'Cerrar aviso');
    cerrar.innerHTML = '&times;';

    aviso.appendChild(icono);
    aviso.appendChild(cuerpo);
    aviso.appendChild(cerrar);
    contenedor.appendChild(aviso);

    function quitar() {
        if (!aviso.parentNode) return;
        aviso.classList.add('saliendo');
        setTimeout(function () {
            if (aviso.parentNode) aviso.parentNode.removeChild(aviso);
        }, 300);
    }

    cerrar.addEventListener('click', quitar);
    setTimeout(quitar, 4000);
};

// Mensajes que vienen del servidor (navegacion normal, sin AJAX)
{% if messages %}
    {% for message in messages %}
        window.mostrarAviso("{{ message|escapejs }}", {% if message.tags == 'error' %}true{% else %}false{% endif %});
    {% endfor %}
{% endif %}
</script>

</body>
</html>
